name: 持ち越しの集計と公開

on:
  schedule:
    # 毎日 06:00（JST）
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "全件モード（#1 から最新まで解析し直す）"
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-carryover
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # ローカルと同じく、3 つのリポジトリを兄弟ディレクトリに置く
      - name: チェックアウト（daily-tasks-git）
        uses: actions/checkout@v5
        with:
          path: daily-tasks-git

      - name: チェックアウト（収集ツール gr002_daily-tasks）
        uses: actions/checkout@v5
        with:
          repository: KenichiroArai/gr002_daily-tasks
          path: gr002_daily-tasks

      - name: チェックアウト（画面 mk002_daily-tasks_web-next）
        uses: actions/checkout@v5
        with:
          repository: KenichiroArai/mk002_daily-tasks_web-next
          path: mk002_daily-tasks_web-next

      - name: Java 25 のセットアップ
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: gr002_daily-tasks/pom.xml

      - name: ビルドとテスト
        working-directory: gr002_daily-tasks
        run: mvn -B -ntp package

      - name: Issue の収集と集計
        working-directory: daily-tasks-git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FULL: ${{ inputs.full }}
        run: |
          JAR=../gr002_daily-tasks/target/gr002_daily-tasks-0.1.0.jar
          if [ "$FULL" = "true" ]; then
            java -jar "$JAR" --full
          else
            java -jar "$JAR"
          fi

      - name: 差分のコミット
        working-directory: daily-tasks-git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "docs/data に変更はありません"
            exit 0
          fi
          git commit -m "持ち越しデータを更新（${{ github.event_name }}）"
          # GitHub 側の一時的なエラー（500 など）に備えて再試行する
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "push に失敗しました（${i} 回目）。$((i * 10)) 秒後に再試行します"
            sleep $((i * 10))
          done
          echo "push に 5 回失敗しました"
          exit 1

      - name: Pages の設定
        id: pages
        uses: actions/configure-pages@v5

      - name: Node.js のセットアップ
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mk002_daily-tasks_web-next/package-lock.json

      - name: 画面のビルド（Next.js の静的エクスポート）
        working-directory: mk002_daily-tasks_web-next
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Pages 用の成果物のアップロード
        uses: actions/upload-pages-artifact@v4
        with:
          path: mk002_daily-tasks_web-next/out

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages へのデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
