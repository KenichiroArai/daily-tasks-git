# Spring Boot の設定（コマンドラインツールとして動かす）
spring.main.web-application-type=none
spring.main.banner-mode=off
spring.main.log-startup-info=false

# メッセージ（messages.properties）
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# 持ち越しの収集の設定（presentation 層の CarryoverProperties で受け取り、境界ごとに下の層の型に変換して引き継ぐ）

# 対象リポジトリ（owner/name）
carryover.repository=KenichiroArai/daily-tasks-git
# GitHub API のトークン（環境変数 GITHUB_TOKEN。未設定の場合は空で、認証なしで呼び出す）
carryover.token=${GITHUB_TOKEN:}
# 出力先のディレクトリ（リポジトリのルートからの相対パス）
carryover.dataDir=docs/data
# 標準時間の設定ファイル（リポジトリのルートからの相対パス）
carryover.defaultMinutesFile=config/default-minutes.json
# 差分モードで更新日時に関係なく解析し直す最新の Issue の件数
carryover.recentCount=10
