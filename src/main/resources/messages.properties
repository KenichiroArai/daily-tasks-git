# 持ち越しの収集のメッセージ
# ログは SLF4J の {}、例外は String.format の %s / %d を埋め込み位置に使う

# presentation
carryover.command.usage=使い方: java -jar daily-tasks-0.1.0.jar [--full] [--help]\n\
\ \ （引数なし）  差分モード。最新 10 件の Issue は毎回解析し直し、それ以外は保存済みの JSON と更新日時が同じなら解析しない\n\
\ \ --full        全件モード。#1 から最新まで解析し直す\n\
\ \ --help, -h    この使い方を表示する\n\
環境変数 GITHUB_TOKEN が設定されている場合は GitHub API の認証に使う
carryover.command.unknownArgument=不明な引数です: %s

# application
carryover.service.collectResult=モード={}、取得={} 件、解析・保存={} 件、集計={} 日
carryover.service.minutesSourceResult=標準時間で補完した行={} 件、標準時間が未登録の行={} 件
carryover.service.modeFull=全件
carryover.service.modeDiff=差分

# domain
carryover.parser.titleDateNotFound=#{} タイトルから日付を取得できません: {}
carryover.parser.originDateNotFound=#{} 持ち越し元の日付がありません: {}
carryover.parser.nameNotFound=#{} 項目名を取得できません: {}
carryover.parser.minutesNotParsed=#{} 時間表記を解釈できないため標準時間で補完します: {}
carryover.parser.defaultMinutesNotFound=#{} 標準時間が未登録のため 0 分とします: {}
carryover.parser.unexpectedLine=#{} 想定外の行です: {}
carryover.parser.declaredCountMismatch=#{} 残数と解析件数が一致しません: 残={}, 解析={}
carryover.minutesSource.unknownValue=不明な残り時間の取得元です: %s

# repository
carryover.defaultMinutes.fileNotFound=標準時間の設定ファイルがありません: {}
carryover.github.fetched=Issue を {} 件取得しました（{} ページ）
carryover.github.callFailed=GitHub API の呼び出しに失敗しました: status=%d, uri=%s
carryover.github.notArray=GitHub API の応答が配列ではありません: uri=%s
carryover.github.interrupted=GitHub API の呼び出しが中断されました
